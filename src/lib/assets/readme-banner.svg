<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <rect width="800" height="200" rx="12" fill="#1a1a1a"/>

  <!-- grid lines -->
  <line x1="40" y1="80" x2="760" y2="80" stroke="#282828" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="40" y1="120" x2="760" y2="120" stroke="#282828" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="40" y1="160" x2="760" y2="160" stroke="#282828" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- zero/breakeven line -->
  <line x1="40" y1="60" x2="760" y2="60" stroke="#444" stroke-width="0.75" stroke-dasharray="6,4"/>
  <text x="24" y="64" fill="#555" font-family="ui-monospace,monospace" font-size="9" text-anchor="end">$0</text>

  <!-- expected value line (subtle, always visible) -->
  <line x1="40" y1="60" x2="760" y2="170" stroke="#333" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="762" y="175" fill="#444" font-family="ui-monospace,monospace" font-size="8" text-anchor="start" opacity="0.6">E[X]</text>

  <!-- the crash line: brief hope, then inevitable decline -->
  <polyline
    points="40,60 80,57 120,52 160,48 190,45 210,44 240,46 270,50 310,53 340,58 380,62 420,70 460,82 500,96 540,112 580,130 620,146 660,158 700,166 740,172 760,176"
    fill="none"
    stroke="#c53030"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="1200"
    stroke-dashoffset="1200"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="1200"
      to="0"
      dur="3s"
      fill="freeze"
      begin="0.5s"
    />
  </polyline>

  <!-- area fill under the line (fades in) -->
  <polygon
    points="40,60 80,57 120,52 160,48 190,45 210,44 240,46 270,50 310,53 340,58 380,62 420,70 460,82 500,96 540,112 580,130 620,146 660,158 700,166 740,172 760,176 760,200 40,200"
    fill="url(#lossFill)"
    opacity="0"
  >
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="2s"
      fill="freeze"
      begin="1.5s"
    />
  </polygon>

  <!-- gradient for area fill -->
  <defs>
    <linearGradient id="lossFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c53030" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c53030" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- dot at end (appears after line draws) -->
  <circle cx="760" cy="176" r="4" fill="#c53030" opacity="0">
    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="0.3s"
      fill="freeze"
      begin="3.3s"
    />
    <animate
      attributeName="r"
      from="6"
      to="4"
      dur="0.3s"
      fill="freeze"
      begin="3.3s"
    />
  </circle>

  <!-- pulse ring on the dot -->
  <circle cx="760" cy="176" r="4" fill="none" stroke="#c53030" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;14;14" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- title text (fades in after line completes) -->
  <text x="400" y="34" fill="#f7f3ec" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.2em" opacity="0">
    THE HOUSE ALWAYS WINS
    <animate attributeName="opacity" from="0" to="0.9" dur="0.8s" fill="freeze" begin="3.5s"/>
  </text>
</svg>
